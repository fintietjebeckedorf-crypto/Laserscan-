<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arbeiten Erfassung</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --ok: #15803d;
        --error: #b91c1c;
        --primary: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 520px;
        margin: 0 auto;
        padding: 16px;
      }

      .card {
        background: var(--card);
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.4rem;
      }

      .hint {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      #reader {
        width: 100%;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
      }

      .row {
        margin-top: 12px;
      }

      .label {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .code-box {
        margin-top: 6px;
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background: #f9fafb;
        font-weight: 600;
        word-break: break-all;
      }

      .buttons {
        margin-top: 14px;
        display: grid;
        gap: 10px;
      }

      .btn {
        width: 100%;
        min-height: 58px;
        border: none;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 700;
        color: #fff;
        cursor: pointer;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-lasern {
        background: #2563eb;
      }

      .btn-hacken {
        background: #7c3aed;
      }

      .btn-spritzen {
        background: #059669;
      }

      .status {
        margin-top: 12px;
        min-height: 24px;
        font-weight: 600;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.error {
        color: var(--error);
      }

      .status.info {
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Arbeiten erfassen</h1>
        <p class="hint">Code scannen und danach eine Tätigkeit auswählen.</p>

        <div id="reader"></div>

        <div class="row">
          <div class="label">Gescanntes Ergebnis</div>
          <div id="codeBox" class="code-box">Noch kein Code gescannt.</div>
        </div>

        <div class="buttons">
          <button class="btn btn-lasern action-btn" data-taetigkeit="Lasern">Lasern</button>
          <button class="btn btn-hacken action-btn" data-taetigkeit="Hacken">Hacken</button>
          <button class="btn btn-spritzen action-btn" data-taetigkeit="Spritzen">Spritzen</button>
        </div>

        <div id="status" class="status"></div>
      </section>
    </main>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
      // Supabase Konfiguration
      const SUPABASE_URL = "HIER_SUPABASE_URL";
      const SUPABASE_ANON_KEY = "HIER_SUPABASE_ANON_KEY";

      const codeBox = document.getElementById("codeBox");
      const statusEl = document.getElementById("status");
      const actionButtons = Array.from(document.querySelectorAll(".action-btn"));

      let scannedCode = "";
      let scannerReady = false;
      let scannerPaused = false;
      let html5QrCode = null;
      const scannerConfig = {
        fps: 10,
        qrbox: { width: 260, height: 260 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.DATA_MATRIX
        ]
      };

      function setStatus(message, type = "") {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`.trim();
      }

      function resetScanState() {
        scannedCode = "";
        codeBox.textContent = "Noch kein Code gescannt.";
      }

      async function startScanner() {
        if (!window.Html5Qrcode || !window.Html5QrcodeSupportedFormats) {
          setStatus("Scanner-Bibliothek wurde nicht geladen.", "error");
          return;
        }

        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }

        setStatus("Kamera wird gestartet ...", "info");
        try {
          const cameras = await Html5Qrcode.getCameras();
          if (!cameras.length) {
            throw new Error("Keine Kamera gefunden.");
          }

          const preferredCamera =
            cameras.find((cam) => /back|rear|environment/i.test(cam.label)) || cameras[0];

          await html5QrCode.start(
            preferredCamera.id,
            scannerConfig,
            (decodedText) => {
              if (!decodedText || scannedCode) {
                return;
              }
              scannedCode = decodedText;
              codeBox.textContent = decodedText;
              setStatus("Code erkannt. Bitte Tätigkeit auswählen.", "info");
              html5QrCode.pause(true);
              scannerPaused = true;
            },
            () => {}
          );
          scannerReady = true;
          scannerPaused = false;
          setStatus("Scanner bereit.", "info");
        } catch (error) {
          setStatus("Fehler beim Starten der Kamera. Berechtigung prüfen.", "error");
          console.error(error);
        }
      }

      async function saveTaetigkeit(taetigkeit) {
        if (!scannedCode) {
          setStatus("Bitte zuerst einen Code scannen.", "error");
          return;
        }

        setStatus("Speichere ...", "info");

        try {
          const response = await fetch(`${SUPABASE_URL}/rest/v1/arbeiten`, {
            method: "POST",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              "Content-Type": "application/json",
              Prefer: "return=minimal"
            },
            body: JSON.stringify({
              code: scannedCode,
              taetigkeit,
              created_at: new Date().toISOString()
            })
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || "Unbekannter Fehler");
          }

          setStatus("Gespeichert", "ok");
          resetScanState();

          if (scannerReady && scannerPaused) {
            html5QrCode.resume();
            scannerPaused = false;
          }
        } catch (error) {
          setStatus("Fehler beim Speichern.", "error");
          console.error(error);
        }
      }

      actionButtons.forEach((button) => {
        button.addEventListener("click", () => {
          saveTaetigkeit(button.dataset.taetigkeit);
        });
      });

      resetScanState();
      startScanner();
    </script>
  </body>
</html>
