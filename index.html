<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arbeiten Erfassung</title>
    <style>
      :root {
        --bg: #eef2ff;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --ok: #166534;
        --error: #b91c1c;
        --primary: #1d4ed8;
        --border: #dbe4ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
        color: var(--text);
      }

      .container {
        max-width: 520px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 18px 14px 28px;
      }

      .card {
        background: var(--card);
        border-radius: 18px;
        border: 1px solid var(--border);
        padding: 16px;
        box-shadow: 0 14px 36px rgba(29, 78, 216, 0.14);
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
        letter-spacing: 0.2px;
      }

      .hint {
        margin: 8px 0 14px;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .scan-frame {
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #f8faff;
      }

      #reader {
        width: 100%;
        min-height: 300px;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
      }

      .hidden {
        display: none;
      }

      .action-stage {
        margin-top: 14px;
      }

      .label {
        font-size: 0.86rem;
        font-weight: 700;
        letter-spacing: 0.2px;
        color: var(--muted);
        text-transform: uppercase;
      }

      .code-box {
        margin-top: 6px;
        width: 100%;
        min-height: 52px;
        padding: 10px 12px;
        border: 1px solid #c7d2fe;
        border-radius: 10px;
        background: #f8faff;
        font-weight: 600;
        word-break: break-all;
      }

      .buttons {
        margin-top: 14px;
        display: grid;
        gap: 10px;
      }

      .btn {
        width: 100%;
        min-height: 60px;
        border: none;
        border-radius: 12px;
        font-size: 1.05rem;
        font-weight: 700;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(30, 64, 175, 0.2);
        transition: transform 0.12s ease, filter 0.12s ease;
      }

      .btn:active {
        transform: translateY(1px) scale(0.99);
        filter: brightness(0.96);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-lasern {
        background: #2563eb;
      }

      .btn-hacken {
        background: #7c3aed;
      }

      .btn-spritzen {
        background: #059669;
      }

      .btn-secondary {
        background: #475569;
      }

      .status {
        margin-top: 12px;
        min-height: 22px;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.error {
        color: var(--error);
      }

      .status.info {
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Arbeiten erfassen</h1>
        <p class="hint">Bitte zuerst QR- oder DataMatrix-Code scannen.</p>

        <div id="scanStage">
          <div class="scan-frame">
            <div id="reader"></div>
          </div>
        </div>

        <div id="actionStage" class="action-stage hidden">
          <div class="label">Gescanntes Ergebnis</div>
          <div id="codeBox" class="code-box">Noch kein Code gescannt.</div>

          <div class="buttons">
            <button class="btn btn-lasern action-btn" data-taetigkeit="Lasern">Lasern</button>
            <button class="btn btn-hacken action-btn" data-taetigkeit="Hacken">Hacken</button>
            <button class="btn btn-spritzen action-btn" data-taetigkeit="Spritzen">Spritzen</button>
            <button id="rescanBtn" class="btn btn-secondary" type="button">Anderen Code scannen</button>
          </div>
        </div>

        <div id="status" class="status"></div>
      </section>
    </main>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
      // Supabase Konfiguration
      const SUPABASE_URL = "HIER_SUPABASE_URL";
      const SUPABASE_ANON_KEY = "HIER_SUPABASE_ANON_KEY";

      const scanStage = document.getElementById("scanStage");
      const actionStage = document.getElementById("actionStage");
      const codeBox = document.getElementById("codeBox");
      const statusEl = document.getElementById("status");
      const rescanBtn = document.getElementById("rescanBtn");
      const actionButtons = Array.from(document.querySelectorAll(".action-btn"));

      let scannedCode = "";
      let scannerReady = false;
      let scannerPaused = false;
      let html5QrCode = null;
      const scannerConfig = {
        fps: 10,
        qrbox: { width: 260, height: 260 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.DATA_MATRIX
        ]
      };

      function setStatus(message, type = "") {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`.trim();
      }

      function setActionDisabled(disabled) {
        actionButtons.forEach((btn) => {
          btn.disabled = disabled;
        });
        rescanBtn.disabled = disabled;
      }

      function showScanStage() {
        scanStage.classList.remove("hidden");
        actionStage.classList.add("hidden");
      }

      function showActionStage() {
        scanStage.classList.add("hidden");
        actionStage.classList.remove("hidden");
      }

      function resetScanState() {
        scannedCode = "";
        codeBox.textContent = "Noch kein Code gescannt.";
        setActionDisabled(false);
        showScanStage();
      }

      async function startScannerWithFallbacks() {
        const onScanSuccess = (decodedText) => {
          if (!decodedText || scannedCode) {
            return;
          }
          scannedCode = decodedText;
          codeBox.textContent = decodedText;
          showActionStage();
          setStatus("Code erkannt. Bitte Tätigkeit auswählen.", "info");

          if (scannerReady && !scannerPaused) {
            html5QrCode.pause(true);
            scannerPaused = true;
          }
        };

        const tryModes = [];
        tryModes.push({ facingMode: { exact: "environment" } });
        tryModes.push({ facingMode: "environment" });

        try {
          const cameras = await Html5Qrcode.getCameras();
          if (cameras.length > 0) {
            const backCam =
              cameras.find((cam) => /back|rear|environment|world|rueck|rück/i.test(cam.label)) ||
              cameras.find((cam) => !/front|user|face|facetime/i.test(cam.label)) ||
              cameras[0];
            tryModes.push(backCam.id);
          }
        } catch (cameraError) {
          console.warn("Kamera-Liste konnte nicht gelesen werden:", cameraError);
        }

        let lastError = null;
        for (const mode of tryModes) {
          try {
            await html5QrCode.start(mode, scannerConfig, onScanSuccess, () => {});
            return;
          } catch (error) {
            lastError = error;
          }
        }

        throw lastError || new Error("Keine Kamera konnte gestartet werden.");
      }

      async function startScanner() {
        if (!window.Html5Qrcode || !window.Html5QrcodeSupportedFormats) {
          setStatus("Scanner-Bibliothek wurde nicht geladen.", "error");
          return;
        }

        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }

        setStatus("Kamera wird gestartet ...", "info");
        try {
          await startScannerWithFallbacks();
          scannerReady = true;
          scannerPaused = false;
          setStatus("Scanner bereit. Bitte Code vor die Kamera halten.", "info");
        } catch (error) {
          setStatus("Fehler beim Starten der Kamera. Berechtigung prüfen.", "error");
          console.error(error);
        }
      }

      async function saveTaetigkeit(taetigkeit) {
        if (!scannedCode) {
          setStatus("Bitte zuerst einen Code scannen.", "error");
          return;
        }

        setActionDisabled(true);
        setStatus("Speichere ...", "info");

        try {
          const response = await fetch(`${SUPABASE_URL}/rest/v1/arbeiten`, {
            method: "POST",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              "Content-Type": "application/json",
              Prefer: "return=minimal"
            },
            body: JSON.stringify({
              code: scannedCode,
              taetigkeit,
              created_at: new Date().toISOString()
            })
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || "Unbekannter Fehler");
          }

          setStatus("Gespeichert", "ok");
          resetScanState();

          if (scannerReady && scannerPaused) {
            html5QrCode.resume();
            scannerPaused = false;
          }
        } catch (error) {
          setStatus("Fehler beim Speichern.", "error");
          console.error(error);
        } finally {
          setActionDisabled(false);
        }
      }

      actionButtons.forEach((button) => {
        button.addEventListener("click", () => {
          saveTaetigkeit(button.dataset.taetigkeit);
        });
      });

      rescanBtn.addEventListener("click", () => {
        resetScanState();
        setStatus("Bereit für neuen Scan.", "info");
        if (scannerReady && scannerPaused) {
          html5QrCode.resume();
          scannerPaused = false;
        } else if (!scannerReady) {
          startScanner();
        }
      });

      resetScanState();
      startScanner();
    </script>
  </body>
</html>
